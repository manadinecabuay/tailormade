<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supervisor Registration</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .container {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-grow: 1;
    padding: 40px 20px;
  }

  .form-wrapper {
    background: rgba(255, 255, 255, 0.95);
    padding: 50px;
    border-radius: 25px;
    width: 600px;
    max-width: 95%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    color: #333;
  }

  h2 {
    text-align: center;
    margin-bottom: 35px;
    letter-spacing: 2px;
    font-weight: bold;
    color: #667eea;
    font-size: 32px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 25px;
  }

  .input-group label {
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #555;
  }

  .input-group input {
    padding: 14px 18px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 15px;
    color: #333;
    transition: all 0.3s ease;
    font-family: 'Poppins', sans-serif;
  }

  .input-group input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  }

  /* Password and Confirm Password side by side */
  .password-row {
    display: flex;
    gap: 20px;
    margin-bottom: 25px;
  }

  .password-wrapper {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .password-wrapper label {
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #555;
  }

  .password-wrapper input {
    padding: 14px 50px 14px 18px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 15px;
    color: #333;
    transition: all 0.3s ease;
    font-family: 'Poppins', sans-serif;
  }

  .password-wrapper input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  }

  #togglePassword, #toggleConfirm {
    position: absolute;
    right: 15px;
    top: 43px;
    background: none;
    border: none;
    color: #667eea;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.3s ease;
  }

  #togglePassword:hover, #toggleConfirm:hover {
    color: #764ba2;
  }

  .btn {
    margin-top: 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 16px;
    border: none;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    width: 100%;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
  }

  p {
    margin-top: 20px;
    font-size: 14px;
    text-align: center;
    color: #666;
  }

  p a {
    color: #667eea;
    font-weight: bold;
    text-decoration: none;
  }

  p a:hover { 
    text-decoration: underline; 
  }

  /* Password rule box */
  #passwordRules {
    display: none;
    background: rgba(102, 126, 234, 0.1);
    border-left: 4px solid #667eea;
    border-radius: 8px;
    padding: 15px 20px;
    font-size: 13px;
    color: #555;
    margin-top: -15px;
    margin-bottom: 20px;
  }

  #passwordRules p {
    margin: 6px 0;
    font-weight: 500;
  }

  /* Modal Styles */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    justify-content: center;
    align-items: center;
    z-index: 9999;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal-content {
    background: #fff;
    padding: 40px;
    border-radius: 20px;
    width: 400px;
    max-width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    animation: slideIn 0.3s ease;
    position: relative;
  }

  @keyframes slideIn {
    from { transform: translateY(-50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-content.error {
    border-top: 5px solid #dc3545;
  }

  .modal-icon {
    font-size: 60px;
    margin-bottom: 20px;
  }

  .modal-icon.error { color: #dc3545; }

  .modal-content h3 {
    color: #333;
    margin-bottom: 15px;
    font-size: 24px;
    font-weight: 700;
  }

  .modal-content p {
    color: #666;
    margin-bottom: 25px;
    line-height: 1.6;
    font-size: 15px;
  }

  .modal-btn {
    padding: 12px 30px;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: #f8f9fa;
    color: #333;
    border: 2px solid #e0e0e0;
  }

  .modal-btn:hover {
    background: #e9ecef;
    transform: translateY(-2px);
  }

  .close-modal {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 24px;
    color: #999;
    cursor: pointer;
    transition: all 0.3s ease;
    background: none;
    border: none;
    padding: 0;
    width: 30px;
    height: 30px;
    line-height: 30px;
  }

  .close-modal:hover {
    color: #333;
    transform: scale(1.1);
  }

  @media (max-width:768px){
    .form-wrapper { 
      padding: 40px 30px; 
      width: 100%;
    }
    .password-row { 
      flex-direction: column; 
      gap: 0;
    }
    #togglePassword, #toggleConfirm {
      top: 43px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <form class="form-wrapper" action="supervisor_register.php" method="POST" onsubmit="return validatePasswords()">
    <h2>SUPERVISOR REGISTRATION</h2>

    <div class="input-group">
      <label for="first_name">First Name</label>
      <input type="text" id="first_name" name="first_name" placeholder="Enter First Name" required>
    </div>

    <div class="input-group">
      <label for="last_name">Last Name</label>
      <input type="text" id="last_name" name="last_name" placeholder="Enter Last Name" required>
    </div>

    <div class="input-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter Username" required pattern=".*[0-9].*" title="Username must contain at least one number.">
    </div>

    <div class="input-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter Email" required>
    </div>

    <div class="input-group">
      <label for="phone">Phone</label>
      <input type="text" id="phone" name="phone" placeholder="Enter Phone Number" required>
    </div>

    <div class="input-group">
      <label for="address">Address</label>
      <input type="text" id="address" name="address" placeholder="Enter Address" required>
    </div>

    <div class="password-row">
      <div class="password-wrapper">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter Password" required>
        <button type="button" id="togglePassword">Show</button>
      </div>

      <div class="password-wrapper">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
        <button type="button" id="toggleConfirm">Show</button>
      </div>
    </div>

    <div id="passwordRules">
      <p>• At least 8 characters</p>
      <p>• At least one uppercase letter</p>
      <p>• At least one number</p>
    </div>

    <button type="submit" class="btn">Register</button>
    <p>Already have an account? <a href="login_admins.html">Login here</a></p>
  </form>
</div>

<!-- Error Modal -->
<div id="errorModal" class="modal-overlay">
  <div class="modal-content error">
    <button class="close-modal" onclick="closeModal()">&times;</button>
    <div class="modal-icon error">❌</div>
    <h3>Error!</h3>
    <p id="errorMessage">Passwords do not match!</p>
    <button class="modal-btn" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
  // Show/Hide Password
  const passwordInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirm_password');
  const togglePassword = document.getElementById('togglePassword');
  const toggleConfirm = document.getElementById('toggleConfirm');

  togglePassword.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    togglePassword.textContent = isPassword ? 'Hide' : 'Show';
  });

  toggleConfirm.addEventListener('click', () => {
    const isPassword = confirmInput.type === 'password';
    confirmInput.type = isPassword ? 'text' : 'password';
    toggleConfirm.textContent = isPassword ? 'Hide' : 'Show';
  });

  // Password rule visibility
  const passwordRules = document.getElementById('passwordRules');
  passwordInput.addEventListener('focus', () => { passwordRules.style.display = 'block'; });
  passwordInput.addEventListener('blur', () => { 
    setTimeout(() => { passwordRules.style.display = 'none'; }, 200);
  });

  // Modal Functions
  function showModal(message) {
    document.getElementById('errorMessage').textContent = message;
    document.getElementById('errorModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('errorModal').style.display = 'none';
  }

  // Close modal when clicking outside
  window.addEventListener('click', function(e) {
    if (e.target.classList.contains('modal-overlay')) {
      closeModal();
    }
  });

  // Confirm password validation
  function validatePasswords() {
    const password = passwordInput.value;
    const confirmPassword = confirmInput.value;

    // Check if passwords match
    if (password !== confirmPassword) {
      showModal('Passwords do not match!');
      return false;
    }

    // Check password requirements
    const hasUpperCase = /[A-Z]/.test(password);
    const hasNumber = /[0-9]/.test(password);
    const hasMinLength = password.length >= 8;

    if (!hasMinLength) {
      showModal('Password must be at least 8 characters long!');
      return false;
    }

    if (!hasUpperCase) {
      showModal('Password must contain at least one uppercase letter!');
      return false;
    }

    if (!hasNumber) {
      showModal('Password must contain at least one number!');
      return false;
    }

    return true;
  }
</script>

</body>
</html>
